[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "genealogy-cli"
version = "0.1.0"
description = "Local genealogy research exports from the WikiTree API"
requires-python = ">=3.10"

[project.scripts]
genealogy = "genealogy:main"

[tool.setuptools]
py-modules = ["genealogy"]
packages = ["storyboard"]

[tool.setuptools.package-data]
storyboard = ["template.html", "atlas.js", "world.json", "places.json.gz"]
